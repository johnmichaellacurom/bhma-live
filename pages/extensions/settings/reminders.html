<div class="w-100">
  <label class="form-label text-uppercase">Display</label>
  <select class="form-select" id="settingsRemindersDisplay">
    <option value="5">5</option>
    <option value="10">10</option>
    <option value="25">25</option>
    <option value="50">50</option>
    <option value="100">100</option>
  </select>
</div>
<div class="w-100">
  <label class="form-label text-uppercase">Payment Due</label>
  <select class="form-select" id="settingsRemindersPaymentDue">
    <option selected value="off">Off</option>
    <option value="0">On Due Date</option>
    <option value="1">1 day before</option>
    <option value="3">3 days before</option>
    <option value="5">5 days before</option>
  </select>
</div>
<div class="w-100">
  <label class="form-label text-uppercase">Birthday</label>
  <select class="form-select" id="settingsRemindersBirthday">
    <option selected value="off">Off</option>
    <option value="0">On Due Date</option>
    <option value="1">1 day before</option>
    <option value="3">3 days before</option>
    <option value="5">5 days before</option>
  </select>
</div>
